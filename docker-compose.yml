services:
  redis:
    image: redis:7-alpine
    container_name: crumbstall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - crumbstall-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crumbstall-redis-data:
